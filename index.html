<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image & Video Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <textarea id="prompt" placeholder="Type your prompt here..."></textarea>
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="image">IMAGE</button>
            <button class="mode-btn" data-mode="video">VIDEO</button>
        </div>
        <button id="generate-btn">GENERATE</button>
        <div id="result-container">
            <span>Generated result appears here</span>
        </div>
        <button id="download-btn" class="hidden">DOWNLOAD</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
