<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image & Video Generator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #1e293b; padding: 2rem; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        textarea { width: 100%; height: 80px; background: #0f172a; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; resize: none; margin-bottom: 1rem; box-sizing: border-box; }
        .mode-selector { display: flex; gap: 10px; margin-bottom: 1rem; }
        .mode-btn { flex: 1; padding: 10px; background: #334155; border: none; color: #fff; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .mode-btn.active { background: #06b6d4; }
        #generate-btn { width: 100%; padding: 12px; background: #6366f1; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; margin-bottom: 1rem; }
        #generate-btn:hover { background: #4f46e5; }
        #result-container { width: 100%; height: 300px; background: #0f172a; border: 2px dashed #334155; border-radius: 6px; display: flex; justify-content: center; align-items: center; text-align: center; overflow: hidden; margin-bottom: 1rem; }
        #result-container img, #result-container video { width: 100%; height: 100%; object-fit: contain; }
        #download-btn { width: 100%; padding: 10px; background: #10b981; border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; }
        #download-btn.hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <textarea id="prompt" placeholder="Type your prompt here..."></textarea>
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="image">IMAGE</button>
            <button class="mode-btn" data-mode="video">VIDEO</button>
        </div>
        <button id="generate-btn">GENERATE</button>
        <div id="result-container">
            <span>Generated result appears here</span>
        </div>
        <button id="download-btn" class="hidden">DOWNLOAD</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
